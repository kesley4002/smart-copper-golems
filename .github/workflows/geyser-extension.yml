name: Build Geyser Copper Golem extension
on:
  push:
    branches: [feature/geyser-bedrock-bridge-0.9.8]
    paths:
      - 'GeyserBridge/**'
      - '.github/workflows/geyser-extension.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Geyser 2.11 extension
        run: bash Fabric/gradlew -p GeyserBridge build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: SmartCopperGolems_GeyserBridge_0.9.8
          path: GeyserBridge/build/libs/*.jar
