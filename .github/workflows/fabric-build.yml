name: Fabric prototype validation
on:
  push:
    branches: ['feature/smart-categories-26.2', 'feature/ai-optimization-26.2', 'feature/barrel-support-26.2', 'feature/catalog-30-categories-26.2', 'feature/alphabetical-container-sorting-26.2', 'feature/food-language-26.2', 'feature/remote-container-animation-26.2', 'feature/remote-chest-sound-fix-26.2', 'feature/food-simplification-ground-chest-26.2', 'feature/work-zone-stick-source-26.2', 'feature/expanded-groups-frame-controls-26.2', 'feature/books-alchemy-utilities-26.2', 'feature/strict-index-custom-config-0.9.2', 'feature/nether-end-sculk-0.9.3', 'feature/merge-wood-accessories-0.9.4', 'feature/stretch-animation-0.9.5', 'feature/stretch-height-0.9.6']
  pull_request:
    branches: ['v-26.2', 'feature/smart-categories-26.2', 'feature/ai-optimization-26.2', 'feature/barrel-support-26.2', 'feature/catalog-30-categories-26.2', 'feature/alphabetical-container-sorting-26.2', 'feature/food-language-26.2', 'feature/remote-container-animation-26.2', 'feature/remote-chest-sound-fix-26.2', 'feature/food-simplification-ground-chest-26.2', 'feature/work-zone-stick-source-26.2', 'feature/expanded-groups-frame-controls-26.2', 'feature/books-alchemy-utilities-26.2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Fabric
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/wrapper-validation@v6
      - name: Compile and validate Fabric
        run: bash gradlew --no-daemon build
      - name: Verify singleplayer and dedicated-server Fabric metadata
        run: >-
          python3 -c 'import json, pathlib, zipfile;
          jars = [p for p in pathlib.Path("build/libs").glob("*.jar") if not p.name.endswith("-sources.jar")];
          assert len(jars) == 1, jars;
          meta = json.loads(zipfile.ZipFile(jars[0]).read("fabric.mod.json"));
          assert meta["environment"] == "*", meta;
          print("Fabric metadata allows singleplayer and dedicated server:", jars[0])'
      - name: Validate all 1413 catalog entries packaged into Fabric JAR
        run: |
          python3 - <<'PY'
          import collections, pathlib, zipfile
          jars = [p for p in pathlib.Path('build/libs').glob('*.jar') if not p.name.endswith('-sources.jar')]
          assert len(jars) == 1, jars
          with zipfile.ZipFile(jars[0]) as z:
              index = z.read('smart-copper-golem/category-index.tsv').decode('utf-8')
              manifest = z.read('smart-copper-golem/category-manifest.tsv').decode('utf-8')
          entries = [line.split('\t') for line in index.splitlines() if line and not line.startswith('#')]
          assert len(entries) == 1413, ('wrong item count', len(entries))
          assert all(len(row) == 2 and row[0].startswith('minecraft:') for row in entries)
          assert len({row[0] for row in entries}) == 1413, 'duplicate item IDs'
          tally = collections.Counter(row[1] for row in entries)
          expected = {}
          for line in manifest.splitlines():
              if not line or line.startswith('#'):
                  continue
              key, label, old_sections, count = line.split('\t')
              assert key not in expected, key
              expected[key] = int(count)
          assert len(tally) == len(expected) == 42, (len(tally), len(expected))
          assert tally == expected, ('manifest mismatch', tally, expected)
          with zipfile.ZipFile(jars[0]) as z:
              translations = z.read('smart-copper-golem/item-names-pt_br.tsv').decode('utf-8')
          localized = [line.split('\t', 1) for line in translations.splitlines()
                       if line and not line.startswith('#')]
          assert len(localized) == 1413, len(localized)
          assert len({row[0] for row in localized}) == 1413
          assert all(len(row) == 2 and row[1].strip() for row in localized)
          assert {row[0] for row in localized} == {row[0] for row in entries}
          print('Verified full PT-BR translation coverage: 1413 items')
          print('Verified', len(entries), 'unique items and', len(tally), 'categories in', jars[0])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: smart-copper-golems-extended-fabric-prototype
          path: Fabric/build/libs/*.jar
          if-no-files-found: error
